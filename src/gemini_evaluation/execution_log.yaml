      response:
        text: |-
          ランプが一瞬光って消える症状は、内部の帯電やショート、または電源まわりの不具合が主な原因です。以下の手順をお試しください。

          1. **放電を行う：** 電源コードや周辺機器（USB等）をすべて外し、10分ほど放置してから電源コードのみを挿して再起動を試します。
          2. **コンセントの見直し：** タコ足配線をやめ、壁のコンセントに直接電源プラグをしっかりと差し込み直してください。
          3. **最小構成の確認：** 外付けHDDや増設メモリ、グラフィックボードなど後から追加した機器を外し、最小限の状態で起動するか試します。
          4. **内部の掃除：** （デスクトップ等の場合）通気口やファンに溜まったホコリを取り除き、熱暴走や接触不良を防ぎます。
          5. **改善しない場合：** 電源ユニットやマザーボードの故障の可能性が高いため、無理にいじらずメーカーや修理業者へ相談してください。
