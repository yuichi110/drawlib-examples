queries:
- id: S1
  category: simple
  title: 初回挨拶（PC起動トラブル）
  prompt: こんにちは！パソコンが急に動かなくなってしまったので相談させてください。
- id: S2
  category: simple
  title: お礼・復旧報告への応答
  prompt: 先ほどの放電手順で無事に電源ランプがつきました。丁寧にご案内いただきありがとうございます！
- id: S3
  category: simple
  title: サポート窓口受付時間の確認
  prompt: パソコン修理サポートの電話窓口とチャット窓口の一般的な受付時間を教えてください。
- id: S4
  category: simple
  title: フリーズ時の強制終了秒数
  prompt: Windowsのパソコンが完全にフリーズしてマウスも動かない場合、電源ボタンを何秒ほど長押しすれば強制終了できますか？短く教えてください。
- id: S5
  category: simple
  title: 型番・シリアル番号の記載場所
  prompt: ノートパソコンの型番（モデル番号）とシリアル番号は、本体のどのあたりに記載されていることが多いですか？
- id: C1
  category: complex
  title: 修理vs買い替え3年間総費用比較
  prompt: 動かなくなったノートPCを修理する場合と新品へ買い替える場合の3年間（36ヶ月）の総コストを比較します。【修理プラン】マザーボード交換38,000円＋SSD交換22,000円（保証外のため全額自己負担）、修理後の消費電力に伴う月平均電気代は2,400円、さらに2年目にバッテリー交換16,000円が必要です。【買い替えプラン】新型PC本体168,000円、故障PCの下取り値引き25,000円、値引き後金額に対する10%ポイント還元（1pt=1円相当として実質差し引き）、省電力CPUにより月平均電気代は1,550円、3年保証込みで追加修理費は0円です。3年間の累計実質負担額はそれぞれ何円になり、どちらが何円お得か途中の計算式も含めて教えてください。
- id: C2
  category: complex
  title: 1.8TB退避＋クラウド転送時間試算
  prompt: 故障しかけているPCから合計1.8TB（1,800GB）の業務データを退避します。内訳は、動画素材1,200GB（連続大ファイル、外付けSSDへの実効書込速度300MB/秒）と、小規模な設計ファイル600GB（多数の小ファイルのため実効書込速度50MB/秒）です。さらに外付けSSDへ退避完了後、そのうち重要データ360GBを社内クラウドへ実効アップロード速度40MB/秒で転送します。（1GB=1,000MBとして計算）ローカル退避にかかる合計分数と、クラウド転送まで含めた総合計時間（何時間何分）をステップ別の計算過程とともに教えてください。
- id: C3
  category: complex
  title: 代替機レンタルvs当日出張修理比較
  prompt: 業務用PCが故障し、以下の2つの復旧プランの総費用（税込換算不要・そのまま計算）を比較します。【通常引取修理＋レンタルPC】引取修理代32,000円、修理完了まで8日間かかり、最初の2日間は予備機がなく業務停止による機会損失が1日あたり18,000円発生、3日目〜8日目の6日間は代替PCレンタル代が1日あたり3,500円＋初期設定費4,000円かかります。【オンサイト当日出張修理】基本修理代32,000円＋出張技術料22,000円＋特急部品手配料12,000円がかかりますが、当日4時間で復旧するため業務停止損失は半日分の9,000円のみで済みます。それぞれの合計実質コスト（修理費＋関連費用＋機会損失）は何円になり、どちらが何円有利か内訳とともに教えてください。
- id: C4
  category: complex
  title: 3台PC保守・増設・クラウド2年試算
  prompt: オフィス用のPC 3台について2年間（24ヶ月）の保守・アップグレード総額を計算してください。(1)基本保守契約：1台あたり月額600円×3台×24ヶ月、(2)期間中に訪問修理を合計2回利用（通常1回6,900円ですが保守契約により1回あたり3,300円割引）、(3)3台すべてに16GBメモリ増設を実施（通常1台10,400円ですが3台同時申込で1台あたり600円割引）、(4)クラウドバックアップ契約（3台まとめて1年目は月額550円×12ヶ月、2年目は月額600円×12ヶ月）。(1)〜(4)それぞれの小計と2年間の総合計金額を正確に算出してください。
- id: C5
  category: complex
  title: RAID5 NAS 12TB再構築時間試算
  prompt: 4台の4TB HDDで構成されたRAID 5のNAS（実効容量は (N-1)×4TB）において、現在使用率が75%です。1台のHDDが故障したため新品の4TB
    HDDへ交換しリビルド（再構築）を行います。リビルドでは全ドライブの総容量分（4TB×3台＝12TB、1TB=1,000GB、1GB=1,000MB）を読み書きする必要があり、昼間の業務時間帯（最初の5時間）は帯域制限により実効処理速度が100MB/秒に制限され、夜間の非業務時間帯（5時間経過後以降）は実効処理速度が250MB/秒に上がります。現在の保存データ量（TB）と、リビルド完了までにかかる合計時間（何時間何分）を計算過程とともに教えてください。
