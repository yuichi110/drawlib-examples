prompts:
- id: T1_1
  tier: tier1_simple
  tier_label: 'Tier 1: 短文・挨拶'
  expected_thinking: false
  title: 初回挨拶
  prompt: こんにちは！パソコンが急に動かなくなってしまったので相談させてください。
- id: T1_2
  tier: tier1_simple
  tier_label: 'Tier 1: 短文・挨拶'
  expected_thinking: false
  title: お礼・相槌
  prompt: 先ほどの放電手順で無事に電源ランプがつきました。丁寧にご案内いただきありがとうございます！
- id: T1_3
  tier: tier1_simple
  tier_label: 'Tier 1: 短文・挨拶'
  expected_thinking: false
  title: 修理窓口受付時間の確認
  prompt: パソコン修理サポートの電話窓口とチャット窓口の一般的な受付時間を教えてください。
- id: T2_1
  tier: tier2_procedure
  tier_label: 'Tier 2: 定型トラブル対処'
  expected_thinking: false
  title: 電源が入らない時の放電手順
  prompt: ノートパソコンの電源ボタンを押しても画面が真っ暗なまま起動しない場合、最初に試すべき放電とACアダプター確認の手順を教えてください。
- id: T2_2
  tier: tier2_procedure
  tier_label: 'Tier 2: 定型トラブル対処'
  expected_thinking: false
  title: セーフモードでの起動とバックアップ
  prompt: Windowsが通常起動せず自動修復画面になる場合、セーフモードで起動して外付けUSBメモリへ大事なデータを退避する手順を教えてください。
- id: T2_3
  tier: tier2_procedure
  tier_label: 'Tier 2: 定型トラブル対処'
  expected_thinking: false
  title: システムファイル修復コマンドの実行
  prompt: パソコンの動作が頻繁にフリーズする場合に、コマンドプロンプトから sfc /scannow と DISM コマンドでシステム修復を行う手順を教えてください。
- id: T3_1
  tier: tier3_complex
  tier_label: 'Tier 3: 複雑計算・比較'
  expected_thinking: true
  title: 修理vs新品買い替え3年間総コスト比較
  prompt: 動かなくなったノートPCを修理する場合と新品へ買い替える場合の3年間（36ヶ月）の総コストを比較します。【修理プラン】マザーボード交換38,000円＋SSD交換22,000円（保証外のため全額自己負担）、修理後の消費電力に伴う月平均電気代は2,400円、さらに2年目にバッテリー交換16,000円が必要です。【買い替えプラン】新型PC本体168,000円、故障PCの下取り値引き25,000円、値引き後金額に対する10%ポイント還元（1pt=1円相当として実質差し引き）、省電力CPUにより月平均電気代は1,550円、3年保証込みで追加修理費は0円です。3年間の累計実質負担額はそれぞれ何円になり、どちらが何円お得か途中の計算式も含めて教えてください。
- id: T3_2
  tier: tier3_complex
  tier_label: 'Tier 3: 複雑計算・比較'
  expected_thinking: true
  title: 外付けSSDへのデータ退避・クラウド転送時間試算
  prompt: 故障しかけているPCから合計1.8TB（1,800GB）の業務データを退避します。内訳は、動画素材1,200GB（連続大ファイル、外付けSSDへの実効書込速度300MB/秒）と、小規模な設計ファイル600GB（多数の小ファイルのため実効書込速度50MB/秒）です。さらに外付けSSDへ退避完了後、そのうち重要データ360GBを社内クラウドへ実効アップロード速度40MB/秒で転送します。（1GB=1,000MBとして計算）ローカル退避にかかる合計分数と、クラウド転送まで含めた総合計時間（何時間何分）をステップ別の計算過程とともに教えてください。
- id: T3_3
  tier: tier3_complex
  tier_label: 'Tier 3: 複雑計算・比較'
  expected_thinking: true
  title: 修理期間中の代替PCレンタルvs出張当日修理の損失比較
  prompt: 業務用PCが故障し、以下の2つの復旧プランの総費用（税込換算不要・そのまま計算）を比較します。【通常引取修理＋レンタルPC】引取修理代32,000円、修理完了まで8日間かかり、最初の2日間は予備機がなく業務停止による機会損失が1日あたり18,000円発生、3日目〜8日目の6日間は代替PCレンタル代が1日あたり3,500円＋初期設定費4,000円かかります。【オンサイト当日出張修理】基本修理代32,000円＋出張技術料22,000円＋特急部品手配料12,000円がかかりますが、当日4時間で復旧するため業務停止損失は半日分の9,000円のみで済みます。それぞれの合計実質コスト（修理費＋関連費用＋機会損失）は何円になり、どちらが何円有利か内訳とともに教えてください。
