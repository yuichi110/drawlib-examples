[project]
name = "fastapi-gdrive"
type = "jupyter"
title = "FastAPI on Google Drive (Hello World)"
description = "Minimal Python Hello World notebook for verifying the Drawlib Jupyter + Google Drive (rclone) + Colab workflow."
style = "google"

[i18n]
default_lang = "en"
